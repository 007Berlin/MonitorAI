<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720" role="img" font-family="Arial, Helvetica, sans-serif">
<title>RAI Tracker monitoring pipeline architecture</title>
<desc>A top-down pipeline: data inputs feed schema validation, which fans out to three metric modules (fairness, robustness, transparency), which feed an alert engine reading thresholds from config, then an orchestrator that produces a report, surfaced via a CLI.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 12px; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>
</defs>

<g>
<rect x="120" y="20" width="200" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="220" y="44" text-anchor="middle">Inference logs</text>
<text class="ts" x="220" y="62" text-anchor="middle" fill="#5F5E5A">id, priority, confidence</text>
</g>
<g>
<rect x="360" y="20" width="200" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="460" y="44" text-anchor="middle">Demographic data</text>
<text class="ts" x="460" y="62" text-anchor="middle" fill="#5F5E5A">joined on request_id</text>
</g>

<line x1="220" y1="72" x2="320" y2="110" class="arr" marker-end="url(#arrow)"/>
<line x1="460" y1="72" x2="360" y2="110" class="arr" marker-end="url(#arrow)"/>

<g>
<rect x="220" y="112" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="340" y="136" text-anchor="middle" fill="#0C447C">Validate schema</text>
<text class="ts" x="340" y="154" text-anchor="middle" fill="#185FA5">config.py — fail loud</text>
</g>

<line x1="340" y1="168" x2="340" y2="196" class="arr" marker-end="url(#arrow)"/>

<g>
<rect x="150" y="198" width="380" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="340" y="217" text-anchor="middle" fill="#5F5E5A">Compute metrics — one module per dimension</text>
</g>

<line x1="270" y1="228" x2="160" y2="262" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="228" x2="340" y2="262" class="arr" marker-end="url(#arrow)"/>
<line x1="410" y1="228" x2="520" y2="262" class="arr" marker-end="url(#arrow)"/>

<g>
<rect x="44" y="264" width="180" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="134" y="288" text-anchor="middle" fill="#085041">Fairness</text>
<text class="ts" x="134" y="308" text-anchor="middle" fill="#0F6E56">parity, TPR gap,</text>
<text class="ts" x="134" y="324" text-anchor="middle" fill="#0F6E56">calibration</text>
</g>
<g>
<rect x="250" y="264" width="180" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="288" text-anchor="middle" fill="#3C3489">Robustness</text>
<text class="ts" x="340" y="308" text-anchor="middle" fill="#534AB7">drift, confidence,</text>
<text class="ts" x="340" y="324" text-anchor="middle" fill="#534AB7">volume</text>
</g>
<g>
<rect x="456" y="264" width="180" height="76" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="546" y="288" text-anchor="middle" fill="#712B13">Transparency</text>
<text class="ts" x="546" y="308" text-anchor="middle" fill="#993C1D">completeness,</text>
<text class="ts" x="546" y="324" text-anchor="middle" fill="#993C1D">join integrity</text>
</g>

<line x1="134" y1="340" x2="270" y2="384" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="340" x2="340" y2="384" class="arr" marker-end="url(#arrow)"/>
<line x1="546" y1="340" x2="410" y2="384" class="arr" marker-end="url(#arrow)"/>

<g>
<rect x="220" y="386" width="240" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="340" y="410" text-anchor="middle" fill="#633806">Alert engine</text>
<text class="ts" x="340" y="428" text-anchor="middle" fill="#854F0B">alerts.py — OK / amber / red</text>
</g>

<g>
<rect x="500" y="386" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="570" y="410" text-anchor="middle">Thresholds</text>
<text class="ts" x="570" y="428" text-anchor="middle" fill="#5F5E5A">thresholds.yaml</text>
</g>
<line x1="500" y1="414" x2="462" y2="414" class="arr" marker-end="url(#arrow)"/>

<line x1="340" y1="442" x2="340" y2="470" class="arr" marker-end="url(#arrow)"/>

<g>
<rect x="220" y="472" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="340" y="496" text-anchor="middle" fill="#0C447C">Orchestrator</text>
<text class="ts" x="340" y="514" text-anchor="middle" fill="#185FA5">report.py — side-effect free</text>
</g>

<line x1="340" y1="528" x2="340" y2="556" class="arr" marker-end="url(#arrow)"/>

<g>
<rect x="220" y="558" width="240" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="th" x="340" y="582" text-anchor="middle" fill="#27500A">Report + exit code</text>
<text class="ts" x="340" y="600" text-anchor="middle" fill="#3B6D11">cli.py — scheduled job</text>
</g>

<line x1="340" y1="614" x2="340" y2="642" class="arr" marker-end="url(#arrow)"/>

<g>
<rect x="150" y="644" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="240" y="668" text-anchor="middle">Metrics store</text>
<text class="ts" x="240" y="686" text-anchor="middle" fill="#5F5E5A">trends, dashboards</text>
</g>
<g>
<rect x="350" y="644" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="440" y="668" text-anchor="middle">On-call alert</text>
<text class="ts" x="440" y="686" text-anchor="middle" fill="#5F5E5A">red pages the owner</text>
</g>
<line x1="320" y1="614" x2="250" y2="642" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="614" x2="430" y2="642" class="arr" marker-end="url(#arrow)"/>
</svg>
